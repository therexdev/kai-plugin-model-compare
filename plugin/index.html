<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare models</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="product-experience.css"><link rel="stylesheet" href="plugin-layout.css"></head><body><main id="main"><section id="view-compare" class="view" hidden>
        <div class="cmp-wrap">
          <h1>Compare models</h1>
          <p class="lede">One prompt, two models, blind. Answers stream one at a time (they share the machine), then you reveal which was which. Pick winners to learn which model earns its size.</p>
          <div class="cmp-controls">
            <select id="cmp-a"></select>
            <span class="cmp-vs">vs</span>
            <select id="cmp-b"></select>
          </div>
          <div id="cmp-presets" class="cmp-presets"></div>
          <form id="cmp-form">
            <textarea id="cmp-input" rows="2" placeholder="Ask both models the same thing…"></textarea>
            <button id="cmp-run" class="primary" type="submit">Run both</button>
            <button id="cmp-stop" type="button" hidden>Stop</button>
          </form>
          <div id="cmp-status" class="hint" hidden></div>
          <div id="cmp-panes" hidden>
            <div class="cmp-pane"><div class="cmp-pane-head"><span class="cmp-pane-label" id="cmp-label-0">Answer 1</span></div><div class="cmp-pane-body" id="cmp-body-0"></div></div>
            <div class="cmp-pane"><div class="cmp-pane-head"><span class="cmp-pane-label" id="cmp-label-1">Answer 2</span></div><div class="cmp-pane-body" id="cmp-body-1"></div></div>
          </div>
          <div id="cmp-verdict" hidden>
            <button id="cmp-reveal" class="primary small">Reveal models</button>
            <div id="cmp-vote" hidden>
              <span class="hint">Which answer was better?</span>
              <button class="cmp-vote-btn" data-pick="0">Answer 1</button>
              <button class="cmp-vote-btn" data-pick="1">Answer 2</button>
              <button class="cmp-vote-btn" data-pick="tie">Tie</button>
            </div>
            <div id="cmp-tally" class="hint"></div>
          </div>
        </div>
      </section></main><script src="locales/catalogs.js"></script><script src="i18n.js"></script><script src="markdown.js"></script><script src="legacy-fetch.js"></script><script src="app.js"></script><script src="compare.js"></script><script src="start.js"></script></body></html>
